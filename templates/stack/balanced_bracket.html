<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Balanced Bracket Visualizer</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: 'Poppins', sans-serif;
  }

  body {
    background: linear-gradient(120deg, #d0f0c0, #a5d6a7);
    color: #1b5e20;
    overflow-x: hidden;
  }

  header {
    text-align: center;
    padding: 30px 10px 10px;
  }

  h1 {
    font-size: 2.5rem;
    color: #004d40;
  }

  p.subtitle {
    max-width: 750px;
    margin: 10px auto;
    font-size: 1rem;
    color: #2e7d32;
  }

  main {
    display: flex;
    justify-content: center;
    align-items: flex-start;
    gap: 40px;
    margin-top: 30px;
    flex-wrap: wrap;
  }

  #canvas {
    background: #c8e6c9;
    border-radius: 12px;
    border: 2px solid #00796b;
  }

  .info-panel {
    width: 320px;
    background: #e8f5e9;
    border-radius: 16px;
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
    padding: 20px;
    position: relative;
  }

  .info-panel h2 {
    text-align: center;
    color: #00796b;
    margin-bottom: 15px;
  }

  .info-panel p {
    font-size: 0.95rem;
    color: #333;
    min-height: 70px;
    line-height: 1.5;
    background: #f1f8e9;
    border-radius: 8px;
    padding: 10px;
    margin-bottom: 15px;
  }

  .controls {
    display: flex;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 10px;
  }

  button {
    flex: 1;
    padding: 10px 15px;
    background: #00796b;
    color: white;
    border: none;
    border-radius: 8px;
    font-weight: bold;
    cursor: pointer;
    transition: 0.3s;
  }

  button:hover {
    background: #004d40;
  }

  .legend {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 15px;
    margin: 15px 0 40px;
  }

  .legend span {
    display: flex;
    align-items: center;
    gap: 5px;
  }

  .legend i {
    width: 15px;
    height: 15px;
    border-radius: 3px;
  }

  .legend .stack i { background: lightgreen; border: 1px solid #00796b; }
  .legend .top i { background: gold; }
</style>
</head>
<body>

<header>
  <h1>Balanced Bracket Visualizer</h1>
  <p class="subtitle">
    Learn how a <strong>Stack</strong> checks if parentheses are balanced step-by-step — with real-time visualization and explanations.
  </p>
</header>

<main>
  <canvas id="canvas" width="900" height="400"></canvas>

  <div class="info-panel">
    <h2>Explanation</h2>
    <p id="explanation">Click “Visualize” to start the step-by-step demonstration.</p>
    <div class="controls">
      <button id="visualize">Visualize</button>
      <button id="step">Step</button>
      <button id="randomize">Randomize</button>
      <button id="reset">Reset</button>
    </div>
  </div>
</main>

<div class="legend">
  <span class="stack"><i></i> Stack Element</span>
  <span class="top"><i></i> Top</span>
</div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const rect = { width: 60, height: 25 };
const stackWidth = 200;
const maxW = canvas.width, maxH = canvas.height;
let arr = [], stack = [];
let delay = 900;
let currentIndex = 0;
let isRunning = false;

// Initialize setup
init();

function init() {
  generateArray();
  drawScene();
  document.getElementById("visualize").onclick = () => { if (!isRunning) visualize(); };
  document.getElementById("step").onclick = () => { if (!isRunning) stepOnce(); };
  document.getElementById("randomize").onclick = () => { generateArray(); drawScene(); updateExplanation("New random sequence generated."); };
  document.getElementById("reset").onclick = () => window.location.reload();
}

function generateArray() {
  const samples = [
    ['(', ')', '(', '(', ')', ')', '(', ')'],
    ['(', '(', ')', ')', '(', ')', '(', ')'],
    ['(', ')', '(', '(', ')', ')', '(', ')'],
  ];
  arr = samples[Math.floor(Math.random() * samples.length)];
  stack = [];
  currentIndex = 0;
}

function drawScene() {
  ctx.fillStyle = '#c8e6c9';
  ctx.fillRect(0, 0, maxW, maxH);
  drawStack();
  drawArray();
}

function drawStack() {
  ctx.fillStyle = '#004d40';
  ctx.fillRect(maxW - stackWidth, 0, stackWidth, maxH);
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 15px Poppins';
  ctx.fillText("STACK", maxW - stackWidth / 2 - 25, maxH - 10);

  stack.forEach((val, i) => {
    const y = maxH - 40 - i * 30;
    ctx.fillStyle = i === stack.length - 1 ? 'gold' : 'lightgreen';
    ctx.fillRect(maxW - stackWidth + 15, y, stackWidth - 30, 25);
    ctx.fillStyle = '#222';
    ctx.fillText(val, maxW - stackWidth / 2, y + 18);
  });
}

function drawArray() {
  arr.forEach((val, i) => {
    ctx.fillStyle = i === currentIndex ? "#004d40" : "#00796b";
    ctx.fillRect(80 + i * 70, maxH / 2 - 15, rect.width, rect.height);
    ctx.fillStyle = "#fff";
    ctx.fillText(val, 100 + i * 70, maxH / 2 + 5);
  });
}

function updateExplanation(text) {
  document.getElementById("explanation").innerHTML = text;
}

async function visualize() {
  isRunning = true;
  updateExplanation("Starting visualization...");
  for (; currentIndex < arr.length; currentIndex++) {
    const val = arr[currentIndex];
    highlightBracket(currentIndex);
    await sleep(delay);

    if (val === '(') {
      stack.push(val);
      gsap.to({}, { duration: 0.3, onUpdate: drawScene });
      updateExplanation(`Encountered '(' → Push into stack.`);
    } else {
      if (stack.length === 0) {
        updateExplanation(`Encountered ')' → Stack empty → ❌ Not balanced.`);
        alert("❌ Not Balanced: extra closing bracket found!");
        isRunning = false;
        return;
      }
      stack.pop();
      gsap.to({}, { duration: 0.3, onUpdate: drawScene });
      updateExplanation(`Encountered ')' → Pop from stack.`);
    }

    drawScene();
    await sleep(delay);
  }

  if (stack.length === 0) {
    updateExplanation("✅ All brackets matched → Balanced!");
    alert("✅ Brackets are Balanced!");
  } else {
    updateExplanation("❌ Some '(' remain → Not Balanced!");
    alert("❌ Not Balanced: some opening brackets left unmatched!");
  }
  drawScene();
  isRunning = false;
}

function stepOnce() {
  if (currentIndex >= arr.length) {
    updateExplanation("All elements processed.");
    return;
  }
  const val = arr[currentIndex];
  if (val === '(') {
    stack.push(val);
    updateExplanation(`Step ${currentIndex + 1}: Encountered '(' → Push into stack.`);
  } else {
    if (stack.length === 0) {
      updateExplanation(`Step ${currentIndex + 1}: ')' with empty stack → Not balanced.`);
      alert("❌ Not Balanced: extra closing bracket!");
      return;
    }
    stack.pop();
    updateExplanation(`Step ${currentIndex + 1}: Encountered ')' → Pop from stack.`);
  }
  currentIndex++;
  drawScene();
}

function highlightBracket(i) {
  drawScene();
  ctx.strokeStyle = "red";
  ctx.lineWidth = 3;
  ctx.strokeRect(80 + i * 70, maxH / 2 - 15, rect.width, rect.height);
}

function sleep(ms) {
  return new Promise(resolve => setTimeout(resolve, ms));
}
</script>
</body>
</html>
